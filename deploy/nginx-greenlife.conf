# /etc/nginx/sites-available/greenlife  (HTTPS qua certbot: certbot --nginx -d shop.example.vn)
server {
    listen 80;
    server_name shop.example.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shop.example.vn;
    root /var/www/greenlife/public;          # CHỈ public/ được phục vụ: .env, storage/ nằm ngoài web root
    index index.php;
    charset utf-8;
    client_max_body_size 8m;
    server_tokens off;

    # ssl_certificate / ssl_certificate_key do certbot thêm

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* { deny all; }   # chặn .env, .git...
    location ~ \.php$ { return 404; }              # mọi file .php khác index.php
}
