; /etc/supervisor/conf.d/greenlife-worker.conf  -> supervisorctl reread && supervisorctl update
; Hàng đợi gửi mail (đặt hàng, đổi trạng thái đơn, lên hạng). Thiếu worker => khách KHÔNG nhận mail.
[program:greenlife-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/greenlife/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --memory=256
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=120
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/greenlife-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
